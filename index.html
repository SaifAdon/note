<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>notebook</title>
</head>
<body>
    <section class="main">
    <div class="container">
        <div class="header">
            <h2>notebook</h2>
            <h4>capture your thoughts</h4>
        </div>
        <div class="btn">
            <button id="createbtn" type="button">Create Note</button>
        </div>
        <div class="notes">
       
        </div>

        <form class="popup">
        <div class="popupcontent">
            <p class="date"></p>
            <input required class="thumbnail" type="text" placeholder="Thumbnail">
            <input required type="text" placeholder="Dummy Title" class="title">
            <textarea required placeholder="Dummy Content" class="dummycontent"></textarea>
            <button type="button" id="updatebtn">Update</button>
            <button type="button" id="closebtn">Close</button>
            <button type="button" id="deletebtn">Delete</button>
            </div>
        </form>
    </div>
    </div>
    </section>



 
    
    <script src="script.js"></script>
</body>
</html>
